[package]
name = "tsbvm"
version = "0.1.0"
edition = "2021"

[features]
# `host("http.post_json", ...)` for the command-line tool. Off by default so
# the library and the wasm drop stay free of a TLS stack.
http = ["dep:ureq"]

[dependencies]
ureq = { version = "2", optional = true, default-features = false, features = ["tls"] }

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
# 小さく。この VM は配るものなので、速さより先に大きさを見る
# (opt-level = "z" と panic = "abort" と lto で、3 のときの 125,387 から)
opt-level = "z"
panic = "abort"
lto = true
codegen-units = 1
strip = true
