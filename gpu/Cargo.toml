[package]
name = "tsubaki-gpu"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3.103"
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
bytemuck = "1"
futures-channel = { version = "0.3", default-features = false, features = ["alloc"] }
wgpu = { version = "30.0.0", default-features = false, features = ["wgsl", "web", "webgpu", "webgl"] }
web-sys = { version = "0.3.103", features = ["HtmlCanvasElement"] }

[profile.release]
opt-level = 3
