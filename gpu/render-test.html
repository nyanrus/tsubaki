<!doctype html>
<meta charset="utf-8" />
<title>tsubaki-gpu rainbow triangle</title>
<canvas id="canvas" width="300" height="300" style="border: 1px solid #444"></canvas>
<pre id="out">running...</pre>
<script type="module">
  import init, {
    gpu_init,
    configure_canvas,
    create_render_pipeline,
    begin_frame,
    draw_frame,
    end_frame,
  } from "./pkg/tsubaki_gpu.js";

  const out = document.getElementById("out");
  const log = (s) => (out.textContent += "\n" + s);

  // The WGSL itself lives here, not in the Rust crate -- tsubaki-gpu only
  // supplies the plumbing (canvas surface, render pipeline, draw call). No
  // vertex buffer at all: three hardcoded positions/colors indexed by
  // @builtin(vertex_index), the classic "hello triangle" shape, interpolated
  // across the face by the fragment stage -- the rainbow is just that
  // interpolation.
  const RAINBOW_TRIANGLE_WGSL = `
    struct VertexOutput {
      @builtin(position) position: vec4<f32>,
      @location(0) color: vec3<f32>,
    };

    @vertex
    fn vs_main(@builtin(vertex_index) idx: u32) -> VertexOutput {
      var positions = array<vec2<f32>, 3>(
        vec2<f32>(0.0, 0.6),
        vec2<f32>(-0.6, -0.6),
        vec2<f32>(0.6, -0.6),
      );
      var colors = array<vec3<f32>, 3>(
        vec3<f32>(1.0, 0.0, 0.0),
        vec3<f32>(0.0, 1.0, 0.0),
        vec3<f32>(0.0, 0.4, 1.0),
      );
      var out: VertexOutput;
      out.position = vec4<f32>(positions[idx], 0.0, 1.0);
      out.color = colors[idx];
      return out;
    }

    @fragment
    fn fs_main(in: VertexOutput) -> @location(0) vec4<f32> {
      return vec4<f32>(in.color, 1.0);
    }
  `;

  try {
    await init();
    out.textContent = "wasm loaded, requesting GPU...";
    const canvas = document.getElementById("canvas");
    // Passing the canvas here (not just to configure_canvas below) is what
    // lets gpu_init actually fall back to WebGL when WebGPU isn't
    // available -- WebGL can't enumerate an adapter without one.
    const adapterInfo = await gpu_init(undefined, canvas);
    log("adapter: " + JSON.stringify(adapterInfo));

    configure_canvas(canvas, canvas.width, canvas.height, "opaque");
    log("canvas configured");

    const pipeline = await create_render_pipeline(RAINBOW_TRIANGLE_WGSL, "vs_main", "fs_main", [], "triangle-list", "replace");
    log("render pipeline created, handle=" + pipeline);

    begin_frame(0.05, 0.05, 0.08, 1.0);
    draw_frame(pipeline, [], 3, 1);
    end_frame();
    log("rendered one frame");

    // Read back actual pixel colors to verify this isn't just "no error" --
    // a canvas readback (drawImage from the WebGPU canvas onto a 2D canvas,
    // then getImageData) proves real, differently-colored pixels landed
    // where the triangle's three corners/interior should be.
    const check = document.createElement("canvas");
    check.width = canvas.width;
    check.height = canvas.height;
    const ctx2d = check.getContext("2d");
    ctx2d.drawImage(canvas, 0, 0);
    const px = (x, y) => Array.from(ctx2d.getImageData(x, y, 1, 1).data);
    const bg = px(5, 5); // corner, outside the triangle -- should be the clear color
    const center = px(150, 170); // inside the triangle -- should be a real mixed color, not the background
    log("background pixel (outside triangle): " + bg.join(","));
    log("center pixel (inside triangle):       " + center.join(","));

    const bgIsClear = Math.abs(bg[0] - 13) < 20 && Math.abs(bg[2] - 20) < 20;
    const centerIsNotBg = Math.abs(center[0] - bg[0]) + Math.abs(center[1] - bg[1]) + Math.abs(center[2] - bg[2]) > 30;
    log(bgIsClear && centerIsNotBg ? "PASS" : "FAIL");
  } catch (e) {
    log("ERROR: " + e);
    console.error(e);
  }
</script>
